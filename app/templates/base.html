<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}MGM Resort{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Header&Footer.css') }}">
    <style>
        /* Chat Widget Styles */
        #chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #chat-tab {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        #chat-tab:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .chat-popup {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 350px;
            height: 500px; /* Adjusted height */
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            display: none; /* Controlled by JS as 'flex' */
            flex-direction: column; 
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* 1. FIXED HEADER */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* Header stays at the top */
            min-height: 50px; /* Ensure minimum height */
        }

        .chat-header h4 { 
            margin: 0; 
            font-size: 16px; 
            flex: 1; /* Take available space */
            line-height: 1.2; /* Good line height for wrapping */
            word-wrap: break-word; /* Allow long words to break */
            white-space: normal; /* Allow text to wrap to next line */
        }

        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        /* 2. SCROLLABLE MIDDLE HISTORY */
        .chat-messages {
            flex: 1;            /* Takes up all remaining middle space */
            padding: 20px;
            overflow-y: auto;   /* Scrollable when content overflows */
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 3. FLUSHED BOTTOM INPUT */
        .chat-input {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: white;
            flex-shrink: 0; /* Input stays at the bottom */
        }

        .chat-input input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 8px 15px;
            outline: none;
        }

        .chat-input button {
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Message Bubbles */
        .chat-message {
            padding: 10px 14px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
        }

        .chat-message.customer {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-message.support {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-time {
            display: block;
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-container">
        <div class="header-left">
            <a href="/" class="brand">MGM Resort</a>
            <nav class="main-nav">
                <a href="#">Explore resorts</a>
                <a href="{{ url_for('main.book_room') if url_for else '#' }}">Book a room</a>
                </nav>
        </div>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    </footer>

<div id="chat-widget">
    <div id="chat-tab" onclick="toggleChat()">
        <i class="fas fa-comments"></i> Chat Support
        <span id="chat-badge" class="chat-badge" style="display: none;">1</span>
    </div>
    
    <div id="chat-popup" class="chat-popup">
        <div class="chat-header">
            <h4>Concierge Support</h4>
            <button onclick="toggleChat()" class="chat-close">&times;</button>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            </div>
        
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="Ask about check-in..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
const socket = io();
let chatOpen = false;

function toggleChat() {
    const popup = document.getElementById('chat-popup');
    const badge = document.getElementById('chat-badge');
    chatOpen = !chatOpen;
    
    if (chatOpen) {
        // We use flex so the child elements (header, msg, input) 
        // obey the flex-grow/shrink rules.
        popup.style.display = 'flex'; 
        badge.style.display = 'none';
        socket.emit('join_chat', {room: 'customer_service'});
    } else {
        popup.style.display = 'none';
    }
}

function sendMessage() {
    const input = document.getElementById('message-input');
    const msg = input.value.trim();
    
    if (msg) {
        socket.emit('send_message', {
            msg: msg,
            sender: 'customer',
            room: 'customer_service'
        });
        addMessageToChat('You', msg, 'customer');
        input.value = '';
    }
}

function handleKeyPress(event) {
    if (event.key === 'Enter') sendMessage();
}

function addMessageToChat(sender, message, senderType) {
    const messagesDiv = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `chat-message ${senderType}`;
    
    messageDiv.innerHTML = `
        <strong>${sender}:</strong> <div>${message}</div>
        <span class="chat-time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
    `;
    
    messagesDiv.appendChild(messageDiv);
    
    // Auto-scroll to the bottom when a new message arrives
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

socket.on('receive_message', function(data) {
    if (!chatOpen && data.sender !== 'customer') {
        document.getElementById('chat-badge').style.display = 'block';
    }
    // Using 'support' as the class for AI/Admin replies
    const type = data.sender === 'customer' ? 'customer' : 'support';
    addMessageToChat(data.sender, data.msg, type);
});
</script>

</body>
</html>
