{% extends "base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
  <h1>Verify OTP</h1>
  <p>Enter the 6-digit code sent to your email. It expires in 5 minutes.</p>

  <form method="post" action="{{ url_for('auth.verify_otp_post') }}" class="auth-form">
    <label for="otp">OTP</label>
    <input id="otp" name="otp" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" required>

    <button type="submit" class="auth-btn">Verify</button>
  </form>

  <p class="auth-alt">
    Didn’t get a code?
    <a href="{{ url_for('auth.login_get') }}">Go back to login</a>
  </p>
</div>
{% endblock %}
